<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset password - Grand Stay Hotel</title>
  <link rel="stylesheet" href="auth.css" />
</head>
<body class="auth">
  <aside class="visual" style="--bg:url('https://images.unsplash.com/photo-1578683010236-d716f9a3f461?auto=format&fit=crop&w=1400&q=80')">
    <a class="brand" href="index.html">GRAND<span>STAY</span></a>
    <div>
      <h2>Forgot your password? No problem.</h2>
      <p class="sub">Enter the email you registered with and choose a new password to get back to your bookings.</p>
    </div>
    <small>&copy; Grand Stay Hotel</small>
  </aside>

  <main class="panel">
    <div class="box">
      <a class="mobile-brand" href="index.html">GRAND<span>STAY</span></a>
      <h1>Reset password</h1>
      <p class="lead">Use your registered email and set a new password.</p>

      <div id="alert" class="alert" hidden></div>

      <form id="resetForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <div class="input"><input type="email" id="email" autocomplete="email" placeholder="you@example.com" /></div>
        </div>
        <div class="field">
          <label for="newPassword">New password</label>
          <div class="input has-toggle">
            <input type="password" id="newPassword" autocomplete="new-password" placeholder="At least 6 characters" />
            <button type="button" class="toggle">Show</button>
          </div>
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm new password</label>
          <div class="input has-toggle">
            <input type="password" id="confirmPassword" autocomplete="new-password" placeholder="Repeat the new password" />
            <button type="button" class="toggle">Show</button>
          </div>
        </div>
        <button type="submit" class="submit" id="submitBtn">Reset password</button>
      </form>

      <div class="alt"><a href="login.html">&larr; Back to login</a></div>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script>
    const form = document.getElementById("resetForm");
    const alertBox = document.getElementById("alert");
    const btn = document.getElementById("submitBtn");
    const el = {
      email: document.getElementById("email"),
      newPassword: document.getElementById("newPassword"),
      confirmPassword: document.getElementById("confirmPassword"),
    };
    Auth.wireToggles();

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      Auth.clearFieldErrors(form);
      Auth.showAlert(alertBox, "", "");

      const payload = {
        email: el.email.value.trim(),
        newPassword: el.newPassword.value,
        confirmPassword: el.confirmPassword.value,
      };
      let ok = true;
      const fail = (k, m) => { Auth.setFieldError(el[k], m); ok = false; };
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(payload.email)) fail("email", "Enter a valid email address");
      if (payload.newPassword.length < 6) fail("newPassword", "Password must be at least 6 characters");
      if (payload.confirmPassword !== payload.newPassword) fail("confirmPassword", "Passwords do not match");
      if (!ok) return;

      Auth.setBusy(btn, true, "Resetting...");
      const r = await Auth.post("/reset-password", payload);

      if (r.ok) {
        Auth.showAlert(alertBox, "success", "Password reset successfully. Redirecting to login...");
        setTimeout(() => { window.location.href = "login.html?reset=1"; }, 1200);
        return;
      }
      const msg = Auth.explain(r);
      Object.keys(msg.fields).forEach((k) => { if (el[k]) Auth.setFieldError(el[k], msg.fields[k]); });
      Auth.showAlert(alertBox, "error", msg.general || "Please fix the highlighted fields.");
      Auth.setBusy(btn, false, "Reset password");
    });
  </script>
</body>
</html>
